name: Build and deploy Python FastAPI to Azure Web App - workomm01

on:
  push:
    branches:
      - main
    paths:
      - 'works-on-my-machine/**'
      - '!works-on-my-machine/frontend/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: works-on-my-machine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create startup script
        working-directory: works-on-my-machine
        run: |
          echo "gunicorn -c gunicorn.conf.py api.main:app" > startup.sh
          chmod +x startup.sh

      - name: Zip artifact for deployment
        working-directory: works-on-my-machine
        run: zip -r ../backend.zip . -x ".venv/*" "frontend/*" "__pycache__/*" "*.pyc" ".git/*"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_533FFDD3D41847A3A8662FC9689C4914 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8E7CB7038E0A49C1BC7191F43F2B1746 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_17C2225EC4D04A508D4313CD66A46474 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'workomm01'
          slot-name: 'Production'
          package: backend.zip
          startup-command: 'gunicorn -c gunicorn.conf.py api.main:app'
